name: Atualizar bases nutricionais
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_catalogs.py'
      - '.github/workflows/update-food-data.yml'
  schedule:
    - cron: '30 6 1 * *'
permissions:
  contents: write
concurrency:
  group: update-food-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar, normalizar e traduzir tabelas
        run: python scripts/build_catalogs.py
      - name: Verificar estrutura
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path("data").glob("*.json"))
          assert files, "Nenhuma tabela gerada"
          for p in files:
              data=json.loads(p.read_text())
              assert isinstance(data,list) and data, p
              assert all("id" in x and "name" in x and "aa" in x for x in data),p
              print(p,len(data))
          PY
      - name: Publicar arquivos normalizados na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: atualizar USDA e CNF 2026 [skip ci]"
            git push
          fi
